[package]
name = "jg-lint"
version = "0.3.0"
edition = "2021"
description = "Extensible Python linter written in Rust"
license = "MIT"

[lib]
name = "_internal"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = "0.29"
regex = "1"
glob = "0.3"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[features]
extension-module = ["pyo3/extension-module"]
