[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "jg-lint"
version = "0.3.0"
description = "Extensible Python linter written in Rust"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"

[project.scripts]
jg-lint = "jg_linter.cli:main"

[tool.maturin]
features = ["extension-module"]
python-source = "python"
module-name = "jg_linter._internal"

[tool.jg-linter]
select = []
ignore = []
exclude = [".venv/**", "__pycache__/**", "*.egg-info/**", ".git/**", "target/**"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["target", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
